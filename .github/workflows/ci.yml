# =============================================================================
# ClauseOps CI (OPTIONAL convenience)
# =============================================================================
# Docker and CI are optional for the offline-first MVP. This workflow keeps CI
# lightweight and green-able with what exists today:
#
#   * backend-tests: installs ONLY the backend (web) deps and runs the async
#     SQLite-backed suite under app/. That suite needs no PostgreSQL/Redis and no
#     heavy ML stack, so it stays fast and reliable.
#   * frontend-build (optional): `npm ci && npm run build` in frontend/.
#
# The clauseops ML package tests under tests/ require the heavy stack
# (docling + spaCy-trf + torch) and trained model artifacts, so they are NOT run
# here on purpose — running them in CI would be slow, large, and flaky. Run them
# locally with the full requirements.txt installed:
#     pytest app/ tests/
# =============================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-backend.txt
          # aiosqlite drives the async SQLite engine used by the app/ test suite.
          pip install aiosqlite

      - name: Lint (syntax check)
        # Lightweight, no extra config required: byte-compile the package to
        # catch syntax errors. Swap in `ruff check app` if/when ruff is adopted.
        run: python -m compileall app

      - name: Run backend test suite
        run: python -m pytest app/ -q

  frontend-build:
    name: Frontend build (optional)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # Use a clean install when a lockfile exists; otherwise fall back so the
        # job still works before a lockfile is committed.
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build
        run: npm run build
